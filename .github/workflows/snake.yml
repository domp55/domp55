# Dibuja la serpiente que se come tu gráfico de contribuciones.
# Se ejecuta sola cada día; la primera vez lánzala a mano desde la pestaña Actions.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a las 00:00 de Ecuador
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar las imágenes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicarlas en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
